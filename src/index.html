<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Test1</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';" />
    <style>
      body { font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 24px; }
      #force-update-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.92);
        color: #fff;
        z-index: 9999;
        align-items: center; justify-content: center;
      }
      #force-update-overlay.show { display: flex; }
      .card {
        background: #1f1f1f; border-radius: 12px; padding: 28px;
        max-width: 420px; text-align: center;
      }
      .card button {
        background: #0d9d58; color: #fff; border: 0; border-radius: 8px;
        padding: 12px 24px; font-size: 16px; cursor: pointer; margin-top: 12px;
      }
      .card button:disabled { opacity: 0.6; cursor: wait; }
      #progress { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>أهلا بيك في Test1</h1>
    <p>النسخة الحالية: <span id="ver">...</span></p>
    <p id="status">جاري فحص التحديثات...</p>

    <div id="force-update-overlay">
      <div class="card">
        <h2>تحديث إجباري ⚠️</h2>
        <p id="force-msg">نزل تحديث مهم، لازم تحدث عشان تكمل.</p>
        <p id="force-vers"></p>
        <button id="btn-update">حدث الآن</button>
        <p id="progress"></p>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
